<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FASCO - Fashion Store</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/shop_page.css">
    
</head>
<body>
    <div class="bg-gray-100">
        <header class="bg-white shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
                <div class="text-2xl font-bold">FASCO</div>
                <nav>
                <ul class="flex space-x-4">
                    <li><a href="../home_page/index.html" class="text-gray-600 hover:text-gray-900">Home</a></li>
                    <li><a href="../shop_page/index.html" class="text-gray-600 hover:text-gray-900">Shop</a></li>
                    <li><a href="../product_page/index.html" class="text-gray-600 hover:text-gray-900">Products</a></li>
                    <li><a href="#" class="text-gray-600 hover:text-gray-900">Pages</a></li>
                </ul>
                </nav>
                <div class="flex space-x-4">
                <a href="#" class="text-gray-600 hover:text-gray-900"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg></a>
                <a href="#" class="text-gray-600 hover:text-gray-900"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg></a>
                <a href="#" class="text-gray-600 hover:text-gray-900"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg></a>
                <a href="#" class="text-gray-600 hover:text-gray-900"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg></a>
                </div>
            </div>
        </header>
        <!-- Main content -->
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold">Fashion</h1>
                <div class="flex items-center justify-center space-x-2 text-sm text-muted-foreground">
                    <span>Home</span>
                    <span>›</span>
                    <span>Fashion</span>
                </div>
            </div>

            <div class="grid md:grid-cols-[240px_1fr] gap-8">
                <!-- Filters -->
                <aside class="space-y-6">
                    <div>
                        <h3 class="font-semibold mb-4">Size</h3>
                        <div class="grid grid-cols-4 gap-2" id="size-filter">
                            <!-- Size buttons will be inserted here by JavaScript -->
                        </div>
                    </div>

                    <div>
                        <h3 class="font-semibold mb-4">Colors</h3>
                        <div class="grid grid-cols-7 gap-2" id="color-filter">
                            <!-- Color buttons will be inserted here by JavaScript -->
                        </div>
                    </div>

                    <div>
                        <h3 class="font-semibold mb-4">Prices</h3>
                        <div class="space-y-2" id="price-filter">
                            <!-- Price range checkboxes will be inserted here by JavaScript -->
                        </div>
                    </div>

                    <div class="collapsible">
                        <button class="collapsible-trigger">
                            <h3 class="font-semibold">Brands</h3>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div class="collapsible-content space-y-2 mt-4" id="brand-filter">
                            <!-- Brand checkboxes will be inserted here by JavaScript -->
                        </div>
                    </div>

                    <div class="collapsible">
                        <button class="collapsible-trigger">
                            <h3 class="font-semibold">Collections</h3>
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="m6 9 6 6 6-6"/></svg>
                        </button>
                        <div class="collapsible-content space-y-2 mt-4" id="collection-filter">
                            <!-- Collection checkboxes will be inserted here by JavaScript -->
                        </div>
                    </div>

                    <div>
                        <h3 class="font-semibold mb-4">Tags</h3>
                        <div class="flex flex-wrap gap-2" id="tag-filter">
                            <!-- Tag buttons will be inserted here by JavaScript -->
                        </div>
                    </div>
                </aside>

                <!-- Products -->
                <main>
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-xl font-semibold">Best selling</h2>
                        <div class="flex items-center space-x-2">
                            <button id="grid-view" class="btn-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                            </button>
                            <button id="compact-view" class="btn-icon">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/></svg>
                            </button>
                        </div>
                    </div>

                    <div id="product-grid" class="grid md:grid-cols-3 gap-6">
                        <!-- Product cards will be inserted here by JavaScript -->
                    </div>

                    <!-- Pagination -->
                    <div id="pagination" class="flex justify-center mt-8 space-x-2">
                        <!-- Pagination buttons will be inserted here by JavaScript -->
                    </div>
                </main>
            </div>
        </div>
    </div>
    <script src="../js/shop_page.js"></script>
</body>
</html>
