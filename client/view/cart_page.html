<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - FASCO</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/cart_page.css">
</head>
<body>
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <div class="text-2xl font-bold">FASCO</div>
            <nav>
            <ul class="flex space-x-4">
                <li><a href="home_page.html" class="text-gray-600 hover:text-gray-900">Home</a></li>
                <li><a href="shop_page.html" class="text-gray-600 hover:text-gray-900">Shop</a></li>
                <li><a href="product_page.html" class="text-gray-600 hover:text-gray-900">Products</a></li>
                <li><a href="#" class="text-gray-600 hover:text-gray-900">Pages</a></li>
            </ul>
            </nav>
            <div class="flex space-x-4">
            <a href="#" class="text-gray-600 hover:text-gray-900"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg></a>
            <a href="#" class="text-gray-600 hover:text-gray-900"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg></a>
            <a href="#" class="text-gray-600 hover:text-gray-900"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" /></svg></a>
            <a href="#" class="text-gray-600 hover:text-gray-900"><svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" /></svg></a>
            </div>
        </div>
    </header>

    <main class="main-content">
        <h1 class="page-title">Shopping Cart</h1>
        <div class="breadcrumb">
            <a href="/">Home</a>
            <span>></span>
            <span>Your Shopping Cart</span>
        </div>

        <table class="cart-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>
                        <div class="product-info">
                            <img src="/placeholder.svg?height=150&width=120" alt="Mini Dress" class="product-image">
                            <div class="product-details">
                                <h3>Mini Dress With Ruffled Straps</h3>
                                <p class="product-color">Color : Red</p>
                                <a href="#" class="remove-link">Remove</a>
                            </div>
                        </div>
                    </td>
                    <td>$14.90</td>
                    <td>
                        <div class="quantity-controls">
                            <button class="quantity-btn" onclick="updateQuantity(-1)">-</button>
                            <input type="text" value="1" class="quantity-input" id="quantity">
                            <button class="quantity-btn" onclick="updateQuantity(1)">+</button>
                        </div>
                    </td>
                    <td>$14.90</td>
                </tr>
            </tbody>
        </table>

        <div class="gift-wrap">
            <input type="checkbox" id="gift-wrap" onchange="updateTotal()">
            <label for="gift-wrap">For $10.00 Please Wrap The Product</label>
        </div>

        <div class="subtotal">
            <span>Subtotal</span>
            <span id="subtotal-amount">$100.00</span>
        </div>

        <div class="cart-buttons">
            <button class="checkout-btn">Checkout</button>
            <a href="#" class="view-cart-btn">View Cart</a>
        </div>
    </main>

    <script src="../js/cart_page.js"></script>
</body>
</html>
